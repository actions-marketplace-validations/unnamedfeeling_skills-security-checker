name: 'Skill Security Auditor'
description: 'Audits skills against malicious actions, prompt injections, and unsafe commands using an OpenAI-compatible endpoint'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  target-directories:
    description: 'Comma- or newline-separated list of directories to scan (e.g. "skills, prompts, .copilot")'
    required: true
  api-key:
    description: 'API key for the OpenAI-compatible endpoint'
    required: true
  endpoint:
    description: 'Base URL for OpenAI-compatible API calls'
    required: true
    default: 'https://api.openai.com/v1'
  model:
    description: 'Model identifier'
    required: true
    default: 'gpt-4o'
  fail-on-severity:
    description: 'Minimum severity level to fail the CI workflow (CRITICAL, HIGH, MEDIUM, LOW, NONE). Default: HIGH'
    required: false
    default: 'HIGH'
  show-attribution:
    description: 'Whether to show the attribution footer in the step summary (true/false). Default: true'
    required: false
    default: 'true'
  prompt-path:
    description: 'Path to custom audit system prompt markdown file'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Mask secrets in logs
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
      run: |
        if [ -n "$INPUT_API_KEY" ]; then
          echo "::add-mask::$INPUT_API_KEY"
        fi
  
    - name: Validate and Install uv
      id: setup-uv
      shell: bash
      run: |
        if ! command -v uv >/dev/null 2>&1; then
          echo "Installing uv..."
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        else
          echo "uv is already installed."
        fi

    - name: Run Skill Security Auditor
      shell: bash
      env:
        INPUT_TARGET_DIRECTORIES: ${{ inputs.target-directories || inputs.target-directory }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_SHOW_ATTRIBUTION: ${{ inputs.show-attribution }}
        INPUT_PROMPT_PATH: ${{ inputs.prompt-path }}
      run: |
        uv run --project ${{ github.action_path }} python ${{ github.action_path }}/src/app.py
